services:
  - type: web
    name: parkinson-backend
    runtime: docker
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./parkinson_dev.db
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHONUNBUFFERED
        value: 1
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: ALLOWED_ORIGINS
        value: "*"
    healthCheckPath: /health
