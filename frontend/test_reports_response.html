<!DOCTYPE html>
<html>
<head>
    <title>Test Reports API Response</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        pre { background: #f5f5f5; padding: 15px; border-radius: 5px; overflow-x: auto; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 10px 0; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>Reports API Test</h1>
    
    <button onclick="testAPI()">Test /medical/reports Endpoint</button>
    <button onclick="checkLocalStorage()">Check localStorage</button>
    
    <h2>Output:</h2>
    <pre id="output">Click "Test /medical/reports Endpoint" button...</pre>
    
    <script>
        function setOutput(text) {
            const output = document.getElementById('output');
            output.textContent = text;
        }

        function appendLine(text, className) {
            const output = document.getElementById('output');
            const span = document.createElement('span');
            if (className) {
                span.className = className;
            }
            span.textContent = text;
            output.appendChild(span);
            output.appendChild(document.createTextNode('\n'));
        }

        function checkLocalStorage() {
            const token = localStorage.getItem('auth_token');
            const user = localStorage.getItem('user');
            
            setOutput('LocalStorage Check:\n');
            appendLine('auth_token: ' + (token ? 'EXISTS (length: ' + token.length + ')' : 'NOT FOUND'));
            appendLine('user: ' + (user ? 'EXISTS' : 'NOT FOUND'));
        }
        
        async function testAPI() {
            const token = localStorage.getItem('auth_token');
            
            setOutput('Testing API...\n');
            
            if (!token) {
                appendLine('ERROR: No auth_token in localStorage!', 'error');
                appendLine('Please open http://localhost:5174 first and log in.');
                return;
            }
            
            appendLine('Token found (length: ' + token.length + ')');
            appendLine('');
            
            try {
                // Test 1: Call the endpoint
                appendLine('=== Test 1: GET /api/v1/medical/reports ===');
                const response = await fetch('http://localhost:8000/api/v1/medical/reports?page=1&limit=50', {
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    }
                });
                
                appendLine('Status: ' + response.status + ' ' + response.statusText);
                appendLine('Headers: ' + JSON.stringify([...response.headers.entries()], null, 2));
                appendLine('');
                
                const data = await response.json();
                appendLine('Response Body:');
                appendLine(JSON.stringify(data, null, 2));
                appendLine('');
                
                // Test 2: Check response structure
                appendLine('');
                appendLine('=== Test 2: Response Structure Check ===');
                if (data.items) {
                    appendLine('✓ Has "items" property', 'success');
                    appendLine('Total items: ' + data.items.length);
                    appendLine('Total count: ' + data.total);
                    
                    if (data.items.length > 0) {
                        appendLine('');
                        appendLine('First item structure:');
                        appendLine(JSON.stringify(data.items[0], null, 2));
                    }
                } else if (data.data) {
                    appendLine('✗ Has "data" instead of "items"', 'error');
                    appendLine('This is the problem! Frontend expects "items" but backend returns "data"');
                } else {
                    appendLine('✗ Unknown response structure', 'error');
                }
                
            } catch (err) {
                appendLine('ERROR while calling API. See console for details.', 'error');
                console.error(err);
            }
        }
    </script>
</body>
</html>
