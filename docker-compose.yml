version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: parkinson-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./parkinson_dev.db
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ENABLE_GEMINI=false
      - AUDIO_FAST_MODE=true
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-here}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/models:/app/models
      - ./backend/parkinson_dev.db:/app/parkinson_dev.db
    networks:
      - parkinson-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: parkinson-frontend
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    networks:
      - parkinson-network
    restart: unless-stopped

networks:
  parkinson-network:
    driver: bridge

volumes:
  uploads:
  models:
